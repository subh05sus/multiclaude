name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Ensure Linux terminal worker test prerequisites
        if: runner.os == 'Linux'
        run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
      - run: npm test
      - name: Test isolated Podman session lifecycle
        if: runner.os == 'Linux' && matrix.node == '22'
        run: |
          podman build --target worker-base -t localhost/mc-worker-test-base -f remote/Containerfile remote
          podman build --pull=never -t localhost/multiclaude-worker-mock:1 -f test/fixtures/Containerfile test/fixtures
          MC_TEST_PODMAN=1 node --test test/remote-podman.test.ts
      - name: CLI smoke run
        shell: bash
        env:
          MC_HOME: ${{ runner.temp }}/mc
          MC_NO_NOTIFY: '1'
        run: |
          node --disable-warning=ExperimentalWarning src/cli.ts help
          node --disable-warning=ExperimentalWarning src/cli.ts shell status
          node --disable-warning=ExperimentalWarning src/cli.ts doctor || true

  menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh menubar/build.sh "$RUNNER_TEMP/MultiClaude.app"
