name: Release

# Releasing: bump "version" in package.json, add a "## <version> — <date>" section to CHANGELOG.md,
# commit, then: git tag -a v<version> -m "multiclaude <version>" && git push origin main v<version>
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG doesn't match package.json version $PKG"
            exit 1
          fi

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test

      - name: Build and zip the menu bar app
        run: |
          sh menubar/build.sh "$RUNNER_TEMP/MultiClaude.app"
          cd "$RUNNER_TEMP"
          ditto -c -k --keepParent MultiClaude.app MultiClaude-macOS.zip
          codesign --verify --deep --strict MultiClaude.app

      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/MultiClaude-macOS.zip" \
            --verify-tag \
            --title "multiclaude ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
